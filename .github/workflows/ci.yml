name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      # No SUPABASE_* env here on purpose: both astro:env fields are
      # access: "secret" + optional, so they resolve at runtime on the Worker,
      # never at build time. CI stays the pre-merge gate (Workers Builds does
      # not read GitHub check status); it must never deploy (E20).
      - run: npm run build
